[project]
name = "ai-live-translator-engine"
version = "0.1.0"
description = "Real-time bidirectional voice translation engine (local-first)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "soundfile>=0.12",
    "soxr>=0.3",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",  # uvicorn needs it for the live-events WebSocket (TestClient hides its absence)
    "pywebview>=5.3",  # GPL-3.0 — fine as a separate local engine; review before commercial bundling
    # CUDA 12 runtime libs for CTranslate2 on NVIDIA GPUs (Windows/Linux wheels)
    "nvidia-cublas-cu12; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12>=9,<10; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.10", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
